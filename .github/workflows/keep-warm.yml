name: Keep Render Backend Warm

on:
  schedule:
    # 1. Đánh thức server sớm từ 06:40 và 06:50 sáng VN (tức 23:40, 23:50 UTC Chủ Nhật - Thứ Năm)
    # Giúp server tỉnh táo hoàn toàn trước khi nhân viên vào lúc 7:00
    - cron: '40,50 23 * * 0-4'

    # 2. Giữ ấm liên tục mỗi 10 phút từ 07:00 đến 13:50 trưa VN (tức 00:00 - 06:50 UTC Thứ Hai - Thứ Sáu)
    # Đảm bảo không bao giờ chạm ngưỡng 15 phút ngủ đông của Render
    - cron: '*/10 0-6 * * 1-5'

  workflow_dispatch: # Cho phép trigger thủ công từ tab Actions trên GitHub bất cứ lúc nào

jobs:
  ping-backend:
    name: Ping Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging https://fsi-dds.onrender.com/health at $(date)..."
          # Gửi request tới endpoint /health (siêu nhẹ, không tốn tài nguyên DB)
          # max-time 90 giây đủ để đợi server khởi động nếu đang ngủ đông
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://fsi-dds.onrender.com/health)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Backend is awake, healthy, and ready for lunch orders!"
          else
            echo "⚠️ Backend responded with HTTP status $HTTP_STATUS"
          fi
